services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bmp_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmp} -d ${POSTGRES_DB:-bmp_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
