packages:
  - "apps/*"
  - "packages/*"
overrides:
  # GHSA-ggr8-5vv4-36mx: stack exhaustion in deepmerge-ts <8.0.0, pulled in
  # transitively by prisma/@prisma/config@7.10.0. Force the patched version.
  deepmerge-ts: ">=8.0.0"
  # GHSA-3f6p-5ww8-9rcr: auth-plugin downgrade leaking plaintext credentials
  # in mysql2 <3.22.0, pulled in transitively by prisma/@prisma/client@7.10.0
  # (Prisma bundles driver support for every database it can target, even
  # though this project only uses @prisma/adapter-pg for Postgres). Force
  # the patched version.
  mysql2: ">=3.22.0"
  # GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g: prototype pollution / DoS in
  # qs <6.16.0, pulled in transitively by express (via @nestjs/platform-
  # express) and by supertest's superagent. Force the patched version.
  qs: ">=6.16.0"
allowBuilds:
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@inquirer/checkbox@5.2.3"
  - "@inquirer/confirm@6.3.0"
  - "@inquirer/core@12.0.1"
  - "@inquirer/editor@5.3.1"
  - "@inquirer/expand@5.1.3"
  - "@inquirer/input@5.1.4"
  - "@inquirer/number@4.2.1"
  - "@inquirer/password@5.2.0"
  - "@inquirer/prompts@8.7.0"
  - "@inquirer/rawlist@5.3.3"
  - "@inquirer/search@4.3.1"
  - "@inquirer/select@5.2.3"
  - "@inquirer/type@4.1.0"
  - "@nestjs/cli@12.0.0"
  - "@nestjs/common@12.0.1"
  - "@nestjs/config@12.0.0"
  - "@nestjs/core@12.0.1"
  - "@nestjs/platform-express@12.0.1"
  - "@nestjs/schematics@12.0.0"
  - "@nestjs/testing@12.0.1"
  - "@testing-library/react@16.3.3"
  - "@types/node@26.4.0"
  - lint-staged@17.4.1
